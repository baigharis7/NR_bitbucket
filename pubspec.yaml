name: nutrenaissance_flutter
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.9+117

environment:
  sdk: ">=3.0.3 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.2
  intl: ^0.18.0
  hive: ^2.1.0
  shared_preferences: ^2.0.13
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  fluttertoast: ^8.0.9
  numberpicker: ^2.1.1
  json_annotation: ^4.8.1
  http: ^0.13.4
  amplify_flutter: ^0.6.0
  amplify_auth_cognito: ^0.6.0
  jwt_decoder: ^2.0.1
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.0
  flutter_spinkit: ^5.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_bloc: ^8.0.1
  flutter_hooks: ^0.18.5
  table_calendar: ^3.0.8
  chuck_interceptor: ^1.1.2
  carousel_slider: ^4.2.1
  sprintf: ^7.0.0
  upgrader: ^9.0.0
  percent_indicator: ^4.2.2
  mobile_scanner: ^4.0.1
  flutter_timezone: ^1.0.1
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.2.4
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.0.0
  json_serializable: ^6.7.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^1.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:             
  assets:     
    - assets/icon/app_icon.png
    - assets/images/logo_black.png
    - assets/images/logo_name_black.png
    - assets/images/dummy_recipe.jpeg
    - assets/images/logo_letters_black.png
    - assets/images/dish.png
    - assets/images/recipe_image0.png
    - assets/images/recipe_image1.png
    - assets/images/recipe_image2.png
    - assets/images/recipe_image3.png
    - assets/images/recipe_image4.png
    - assets/images/recipe_image5.png
    - assets/images/
    - assets/svg/
    - assets/icon/
    - assets/videos/
    - assets/icon/food_icon.png
    - assets/icon/fork_knife.png
    - assets/icon/journal_icon.png
    - assets/icon/drink_icon.png
    - assets/icon/sport_icon.png
    - assets/icon/filter_icon.png
    - assets/icon/tips_icon.png
    - assets/icon/profile_icon.png
    - assets/icon/omnivorous_icon.png
    - assets/icon/meat_icon.png
    - assets/icon/vegan_icon.png
    - assets/icon/tree_icon.png
    - assets/icon/peanuts_icon.png
    - assets/icon/crustaceans_icon.png
    - assets/icon/nuts_icon.png
    - assets/icon/eggs_icon.png
    - assets/icon/dairy_icon.png
    - assets/icon/mollusks_icon.png
    - assets/icon/sesame_icon.png
    - assets/icon/soy_icon.png
    - assets/icon/sulfites_icon.png
    - assets/icon/spoon_sugar_icon.png
    - assets/icon/share_icon.png
    - assets/html/

  fonts:
    - family: Prettywise
      fonts:
        - asset: assets/fonts/prettywise-regular.otf
        - asset: assets/fonts/prettywise-bold.otf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat-regular.ttf
        - asset: assets/fonts/montserrat-bold.ttf
          weight: 700
    - family: MerriWeather
      fonts:
        - asset: assets/fonts/merriweather-regular.ttf
        - asset: assets/fonts/merriweather-bold.ttf
          weight: 700
    - family: RadioCanadaBig
      fonts:
        - asset: assets/fonts/radiocanadabig-regular.ttf
        - asset: assets/fonts/radiocanadabig-bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  image_path_ios: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanProfood_event_complete.dart.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages