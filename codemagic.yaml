# Codemagic CI/CD Configuration for NutreNaissance Flutter
#
# SETUP REQUIRED IN CODEMAGIC UI:
#
# 1. Environment group "android_signing":
#    - CM_KEYSTORE           - base64-encoded keystore (run: base64 -w 0 android/app/upload-keystore-nn.jks)
#    - CM_KEYSTORE_PASSWORD  - keystore password (encrypted)
#    - CM_KEY_PASSWORD       - key password (encrypted)
#    - CM_KEY_ALIAS          - "upload" (encrypted)
#
# 2. Environment group "ios_signing":
#    - APP_STORE_CONNECT_KEY_IDENTIFIER  - Key ID
#    - APP_STORE_CONNECT_ISSUER_ID       - Issuer ID
#    - APP_STORE_CONNECT_PRIVATE_KEY     - .p8 file contents
#
# 3. Connect your Bitbucket repository in Codemagic UI

workflows:
  # PR Checks - runs on every pull request
  pr-checks:
    name: PR Checks
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze --fatal-infos
      - name: Run tests
        # --reporter=github emits failure annotations as inline checks in
        # the Codemagic log viewer, much easier to scan than the expanded
        # output stream. dart_test.yaml sets the local default to compact.
        script: flutter test --coverage --reporter=github
    artifacts:
      - coverage/**

  # Android Release - runs in parallel with ios-release
  android-release:
    name: Android Release
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.32.8
      groups:
        - android_signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Set up Android signing
        script: |
          KEYSTORE_PATH="$CM_BUILD_DIR/android/upload-keystore-nn.jks"
          echo $CM_KEYSTORE | base64 --decode > "$KEYSTORE_PATH"
          echo "storePassword=$CM_KEYSTORE_PASSWORD" > android/key.properties
          echo "keyPassword=$CM_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$CM_KEY_ALIAS" >> android/key.properties
          echo "storeFile=$KEYSTORE_PATH" >> android/key.properties

      - name: Build Android AAB
        script: flutter build appbundle --release --flavor prod

    artifacts:
      - build/app/outputs/bundle/prodRelease/app-prod-release.aab

  # iOS Release - runs in parallel with android-release
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: 3.32.8
      groups:
        - ios_signing
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Get dependencies
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && rm -f Podfile.lock && pod install --repo-update && cd ..

      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "com.nutrenaissance.nutrenaissanceFlutter" \
            --type IOS_APP_STORE \
            --create

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Set up iOS code signing
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload dSYMs to Firebase Crashlytics
        # Best-effort - don't fail the build if Crashlytics is having a bad
        # day. Without dSYMs Crashlytics can't symbolicate iOS crashes, so
        # this matters every time we ship a build.
        script: |
          set +e
          UPLOAD_SYMBOLS="$CM_BUILD_DIR/ios/Pods/FirebaseCrashlytics/upload-symbols"
          DSYM_DIR="$CM_BUILD_DIR/build/ios/archive/Runner.xcarchive/dSYMs"
          FIREBASE_IOS_APP_ID="1:881238327460:ios:71eff9f522861dc7f9a631"

          if [ ! -f "$UPLOAD_SYMBOLS" ]; then
            echo "WARNING: upload-symbols not found at $UPLOAD_SYMBOLS - skipping"
            exit 0
          fi
          if [ ! -d "$DSYM_DIR" ]; then
            echo "WARNING: no dSYMs at $DSYM_DIR - skipping"
            exit 0
          fi

          "$UPLOAD_SYMBOLS" -ai "$FIREBASE_IOS_APP_ID" -p ios "$DSYM_DIR" || \
            echo "WARNING: upload-symbols failed but continuing"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/Runner.xcarchive/dSYMs

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
