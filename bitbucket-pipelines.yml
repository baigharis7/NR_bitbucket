image: ghcr.io/cirruslabs/flutter:3.13.8

pipelines:
  # Run on PRs targeting master and on pushes to master
  pull-requests:
    '**':
      - step:
          name: Analyze & Test
          caches:
            - flutter
          script:
            - flutter --version
            - flutter pub get
            - flutter analyze --fatal-infos || true  # non-blocking for now
            - flutter test --coverage
            - |
              if command -v lcov &> /dev/null; then
                lcov --summary coverage/lcov.info
              fi
          artifacts:
            - coverage/**

definitions:
  caches:
    flutter: /sdks/flutter
